<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enter password</title>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<style>
  @font-face {
    font-family: 'PixelFont';
    src: local('Courier New');
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #1c5c3f;
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1c5c3f;
    transition: background-color 0.8s ease;
  }

  .content {
    display: flex;
    align-items: center;
    gap: 80px;
    max-width: 900px;
    width: 90%;
  }

  /* --- floating mascot --- */
  .mascot-wrap {
    flex-shrink: 0;
    width: 300px;
    height: 300px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mascot-wrap img {
    width: 100%;
    height: auto;
    animation: floatCycle 6s ease-in-out infinite;
  }

  @keyframes floatCycle {
    0%   { transform: translate(0, 0) rotate(0deg); }
    15%  { transform: translate(4px, -6px) rotate(0.8deg); }
    30%  { transform: translate(-3px, 3px) rotate(-0.6deg); }
    45%  { transform: translate(0, 0) rotate(0deg); }
    50%  { transform: translate(0, 0) rotate(0deg); }
    65%  { transform: translate(-4px, -4px) rotate(-0.8deg); }
    80%  { transform: translate(3px, 5px) rotate(0.6deg); }
    95%  { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(0, 0) rotate(0deg); }
  }

  /* --- text side --- */
  .text-side {
    flex: 1;
    color: #e9e3f0;
  }

  .title {
    font-size: 42px;
    font-weight: bold;
    line-height: 1.15;
    margin: 0 0 20px;
    letter-spacing: 0.5px;
  }

  .description {
    font-size: 16px;
    line-height: 1.6;
    color: #cfc7dc;
    margin: 0 0 32px;
    max-width: 420px;
  }

  /* --- password field --- */
  .pw-form {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-width: 420px;
  }

  #pw-input {
    width: 100%;
    background: #e9e3f0;
    border: none;
    border-radius: 999px;
    padding: 16px 24px;
    font-family: 'Courier New', monospace;
    font-size: 17px;
    font-weight: bold;
    color: #1c5c3f;
    outline: none;
    letter-spacing: 1px;
  }

  #pw-input::placeholder {
    color: #1c5c3f;
    opacity: 0.7;
    font-weight: bold;
  }

  #pw-input.wrong {
    color: #c0392b;
    animation: shake 0.4s ease;
  }

  #pw-input.wrong::placeholder {
    color: #c0392b;
  }

  @keyframes shake {
    0%   { transform: translateX(0); }
    15%  { transform: translateX(-10px); }
    30%  { transform: translateX(9px); }
    45%  { transform: translateX(-7px); }
    60%  { transform: translateX(5px); }
    75%  { transform: translateX(-3px); }
    90%  { transform: translateX(2px); }
    100% { transform: translateX(0); }
  }

  /* --- blackout --- */
  #blackout {
    position: fixed;
    inset: 0;
    background: #000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 999;
  }

  #blackout.active {
    opacity: 1;
    pointer-events: all;
  }

  #game-frame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 998;
    display: none;
  }

  #game-frame.active {
    display: block;
  }

  @media (max-width: 700px) {
    .content {
      flex-direction: column;
      text-align: center;
      gap: 32px;
    }
    .mascot-wrap {
      width: 200px;
      height: 200px;
    }
    .title {
      font-size: 32px;
    }
    .description {
      max-width: none;
    }
    .pw-form {
      max-width: none;
      width: 100%;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .mascot-wrap img {
      animation: none;
    }
    #pw-input.wrong {
      animation: none;
    }
  }

  /* --- Godot game container (hidden until unlocked) --- */
  #game-container {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 998;
  }

  #game-container.active {
    display: block;
  }

  #game-container, #canvas {
    margin: 0;
    padding: 0;
    border: 0;
  }

  #game-container {
    color: white;
    background-color: black;
    overflow: hidden;
    touch-action: none;
  }

  #canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #canvas:focus {
    outline: none;
  }

  #status, #status-splash, #status-progress {
    position: absolute;
    left: 0;
    right: 0;
  }

  #status, #status-splash {
    top: 0;
    bottom: 0;
  }

  #status {
    background-color: #242424;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    visibility: hidden;
  }

  #status-splash {
    max-height: 100%;
    max-width: 100%;
    margin: auto;
  }

  #status-splash.show-image--false {
    display: none;
  }

  #status-splash.fullsize--true {
    height: 100%;
    width: 100%;
    object-fit: contain;
  }

  #status-splash.use-filter--false {
    image-rendering: pixelated;
  }

  #status-progress, #status-notice {
    display: none;
  }

  #status-progress {
    bottom: 10%;
    width: 50%;
    margin: 0 auto;
  }

  #status-notice {
    background-color: #5b3943;
    border-radius: 0.5rem;
    border: 1px solid #9b3943;
    color: #e0e0e0;
    font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
    line-height: 1.3;
    margin: 0 2rem;
    overflow: hidden;
    padding: 1rem;
    text-align: center;
    z-index: 1;
  }
</style>
</head>
<body>

<div id="stage">
  <div class="content">
    <div class="mascot-wrap">
      <img src="mascot.png" alt="Club mascot">
    </div>

    <div class="text-side">
      <h1 class="title">Graveyard<br>Madness</h1>
      <p class="description">A Vampire Survivors-inspired roguelike where you gun down waves of chasing ghosts and stack up powerups to survive.</p>

      <form class="pw-form" id="pw-form" autocomplete="off">
        <input
          type="text"
          id="pw-input"
          placeholder="Enter the password"
          autocomplete="off"
          autofocus
        >
      </form>
    </div>
  </div>
</div>

<div id="blackout"></div>

<div id="game-container">
  <canvas id="canvas">
    Your browser does not support the canvas tag.
  </canvas>

  <noscript>
    Your browser does not support JavaScript.
  </noscript>

  <div id="status">
    <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
    <progress id="status-progress"></progress>
    <div id="status-notice"></div>
  </div>
</div>

<script>
  const CORRECT_PASSWORD = "backfromthedead7492";

  const form = document.getElementById('pw-form');
  const input = document.getElementById('pw-input');
  const blackout = document.getElementById('blackout');
  const gameContainer = document.getElementById('game-container');

  let gameStarted = false;

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    attempt();
  });

  function attempt() {
    if (input.value === CORRECT_PASSWORD) {
      succeed();
    } else {
      fail();
    }
  }

  function fail() {
    input.classList.remove('wrong');
    // force reflow so the shake animation can restart on repeated wrong tries
    void input.offsetWidth;
    input.classList.add('wrong');
    input.value = '';
    input.placeholder = 'Enter the password';
  }

  input.addEventListener('animationend', function () {
    input.classList.remove('wrong');
  });

  function succeed() {
    input.disabled = true;
    blackout.classList.add('active');

    // Wait for the blackout fade to finish, then reveal the game
    // container and boot the Godot engine (only once).
    setTimeout(function () {
      gameContainer.classList.add('active');
      if (!gameStarted) {
        gameStarted = true;
        startGodotGame();
      }
    }, 1000);
  }
</script>

<script src="index.js"></script>
<script>
function startGodotGame() {
  const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":12880160,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
  const GODOT_THREADS_ENABLED = false;
  const engine = new Engine(GODOT_CONFIG);

  const statusOverlay = document.getElementById('status');
  const statusProgress = document.getElementById('status-progress');
  const statusNotice = document.getElementById('status-notice');

  let initializing = true;
  let statusMode = '';

  function setStatusMode(mode) {
    if (statusMode === mode || !initializing) {
      return;
    }
    if (mode === 'hidden') {
      statusOverlay.remove();
      initializing = false;
      return;
    }
    statusOverlay.style.visibility = 'visible';
    statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
    statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
    statusMode = mode;
  }

  function setStatusNotice(text) {
    while (statusNotice.lastChild) {
      statusNotice.removeChild(statusNotice.lastChild);
    }
    const lines = text.split('\n');
    lines.forEach((line) => {
      statusNotice.appendChild(document.createTextNode(line));
      statusNotice.appendChild(document.createElement('br'));
    });
  }

  function displayFailureNotice(err) {
    console.error(err);
    if (err instanceof Error) {
      setStatusNotice(err.message);
    } else if (typeof err === 'string') {
      setStatusNotice(err);
    } else {
      setStatusNotice('An unknown error occurred.');
    }
    setStatusMode('notice');
    initializing = false;
  }

  const missing = Engine.getMissingFeatures({
    threads: GODOT_THREADS_ENABLED,
  });

  if (missing.length !== 0) {
    if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
      let serviceWorkerRegistrationPromise;
      try {
        serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
      } catch (err) {
        serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
      }
      Promise.race([
        serviceWorkerRegistrationPromise.then((registration) => {
          if (registration != null) {
            return Promise.reject(new Error('Service worker already exists.'));
          }
          return registration;
        }).then(() => engine.installServiceWorker()),
        new Promise((resolve) => {
          setTimeout(() => resolve(), 2000);
        }),
      ]).then(() => {
        window.location.reload();
      }).catch((err) => {
        console.error('Error while registering service worker:', err);
      });
    } else {
      const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
      displayFailureNotice(missingMsg + missing.join('\n'));
    }
  } else {
    setStatusMode('progress');
    engine.startGame({
      'onProgress': function (current, total) {
        if (current > 0 && total > 0) {
          statusProgress.value = current;
          statusProgress.max = total;
        } else {
          statusProgress.removeAttribute('value');
          statusProgress.removeAttribute('max');
        }
      },
    }).then(() => {
      blackout.classList.remove('active');
      setStatusMode('hidden');
    }, displayFailureNotice);
  }
}
</script>

</body>
</html>
